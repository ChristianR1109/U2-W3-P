<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backoffice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <div class="container mt-5 text-center">
      <h1>Gestione Prodotti</h1>
      <div class="row g-3 container mt-5 d-flex justify-content-center">
        <div class="col-2">
          <form id="backoffice-form">
            <input type="text" id="name" placeholder="Nome" />
            <input type="text" id="description" placeholder="Descrizione" />
            <input type="text" id="brand" placeholder="Brand" />
            <input type="url" id="imageUrl" placeholder="URL Immagine" />
            <input type="number" id="price" placeholder="Prezzo" />
            <input type="text" id="productId" placeholder="ID prodotto" />
            <button type="submit">Salva Prodotto <i class="bi bi-floppy-fill"></i></button>
          </form>
        </div>
        <div class="col-2 d-flex justify-content-center flex-wrap">
          <button id="editBtn">Modifica prodotto <i class="bi bi-pencil-fill"></i></button>
          <button id="deleteBtn">Elimina prodotto <i class="bi bi-trash-fill"></i></button>
          <button id="resetBtn">FORM-RESET <i class="bi bi-recycle"></i></button>
          <button>
            <a href="./index.html">Torna alla Home <i class="bi bi-house"></i></a>
          </button>
        </div>
      </div>
    </div>
    <script src="./backoffice.js"></script>
  </body>
</html>
